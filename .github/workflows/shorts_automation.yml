name: News Supernova - Auto Shorts
on:
  schedule:   # UTC. IST 8:45, 9:00, 9:15, 18:45, 19:00 (video ~10 min me ban jata hai)
    - cron: "15 3 * * *"
    - cron: "30 3 * * *"
    - cron: "45 3 * * *"
    - cron: "15 13 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run: {description: "true = upload skip, sirf test video", default: "false"}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      MUSIC_VOL: "0.9"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core libraqm0 libfribidi0 libgl1 libglib2.0-0
      - run: pip install -r requirements.txt
      - run: python main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: news-video, path: work/news.mp4, retention-days: 2}
      - name: Save state
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add used_titles.json recent_titles.json used_openers.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "state"; for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done; }
